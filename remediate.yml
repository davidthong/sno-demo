---
- name: Remediate SNOW Demo - Stop plexmediaserver service
  hosts: localhost
  
  tasks:
   
    - ansible.builtin.debug: var=cmdb_sys_id

    - name: Lookup CI name from sys_id
      servicenow.itsm.configuration_item_info:
        sys_id: "{{ cmdb_sys_id }}"
      register: ci_info

    

    - ansible.builtin.debug: 
          msg: "{{ ci_info.records[0].name }}"
  
