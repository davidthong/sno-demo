---
- name: Remediate SNOW Demo - Stop plexmediaserver service
  hosts: localhost
  
  tasks:
   
    - ansible.builtin.debug: var=cmdb_sys_id

    - name: Lookup CI name from sys_id
      servicenow.itsm.configuration_item_info:
        sys_id: "{{ cmdb_sys_id }}"
      register: ci_info

    - ansible.builtin.debug: 
          msg: "{{ ci_info.records[0].name }}"

    - name: Set dynamic target host
      set_fact:
        target_host: "{{ ci_info.records[0].name | lower }}"
    
    - name: Add "{{ target_host }}" to in-memory inventory
      add_host:
        name: "{{ target_host }}"
        groups: dynamic_target

- name: Stop service 
  hosts: dynamic_target
  vars:
     target_service: plexmediaserver
  gather_facts: true
  become: true
  tasks:
    - name: Stop target service
      ansible.builtin.service:
        name: "{{ target_service }}"
        state: stopped
     

    - name: Confirm service stopped
      ansible.builtin.shell: systemctl is-active {{ target_service }}
      register: status
      failed_when: false
