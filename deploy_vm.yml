    #   when: vm_provider is 'nutanix'


    - name: Post-Provisioning Block
      block:
        - name: Calling VM Provisioning Role
          ansible.builtin.debug:
            msg: "..... Provisioning Complete"

        - name: Set Provisioning Success Flag to true
          ansible.builtin.set_fact:
            vm_provisioning_success: true

    
    - name: Post a worknote and a comment on ticket# {{ snow_request_item_number }} when success
      servicenow.servicenow.snow_record:
        display_value: true
        number: "{{ snow_request_item_number }}"
        state: present
        table: sc_req_item
        data:
          work_notes: "This worknote has been introduced by Ansible"
          comments: "This has been provisioned using Ansible Autmation"
          state: "Closed Completed"
      when: vm_provisioning_success == true

