---
- name: Deploy VM
  hosts: localhost
  vars_files:
    - vars/sizing.yml
    - vars/defaults.yml
  vars:
    aap_job_id: "{{ tower_job_id }}"
    aap_job_url: "https://{{ aap_controller_hostname }}/#/jobs/playbook/{{ tower_job_id }}/output"
    provision_ctask_description: Automation - Provision
  tasks:
    - name: Retrieve change requests by number
      servicenow.itsm.change_request_info:
        number: "{{ change_request_number }}"
      register: cr_info

    - name: Get CTask for Automation Provisioning
      servicenow.itsm.change_request_task_info:
        sysparm_query: "change_request={{ cr_info.records[0].sys_id }}^short_description={{ provision_ctask_description }}"
      register: ctask_provision

    - name: Set provision_ctask_number fact
      ansible.builtin.set_fact:
        provision_ctask_number: "{{ ctask_provision.records[0].number }}"
      when:
        - ctask_provision.records | length > 0
        - ctask_provision.records[0].state == 'open'

    - name: Deploy {{ vm_provider }}
      ansible.builtin.debug:
        msg:
          - "Calling {{ vm_provider }} VM Deploy with these parameters"
          - "Hostname --> {{ vm_hostname }}"
          - "Size --> {{ vm_size }}"
          - "Number of CPU --> {{ tshirt_sizes[vm_size].cpu}}"
          - "Memory --> {{ tshirt_sizes[vm_size].ram_gb}}"
          - "Storage --> {{ tshirt_sizes[vm_size].storage_gb}}"
          - "SNOW REQ ID --> {{ snow_request_item_number }}"
          - "SNOW CHANGE RQUEST NUMBER "

    - name: Post-Provisioning Block
      block:
        # - name: Create VM on Nutanix
        #   nutanix.nutanix.nutanix_vm:
        #     prism_host: "{{ nutanix_host }}"
        #     prism_user: "{{ nutanix_username }}"
        #     prism_password: "{{ nutanix_password }}"
        #     validate_certs: false
        #     state: present
        #     name: "{{ vm_name }}"
        #     cluster: "{{ cluster_name }}"
        #     num_vcpus: "{{ tshirt_sizes[size].cpu }}"
        #     num_cores_per_vcpu: 1
        #     memory_gb: "{{ tshirt_sizes[size].ram_gb }}"
        #     nics:
        #       - network: "{{ network_name }}"
        #     disks:
        #       - size_gb: "{{ tshirt_sizes[size].storage_gb }}"
        #         type: "DISK"
        #         bus: "SCSI"
        #     power_state: "on"
        #   register: vm_result
        #   when: vm_provider is 'nutanix'

        # Call VM Provisioning role to perform provisioning tasks
        - name: Calling VM Provisioning Role
          ansible.builtin.debug:
            msg: "..... Provisioning Complete"

        # If all provisioning tasks are executed without error set vm_provisioning_success to trye
        # and update change request CTask
        - name: Set Provisioning Success Flag to true
          ansible.builtin.set_fact:
            vm_provisioning_success: true

        - name: debug result 
          ansible.builtin.debug:
            var: cr_info

        - name: Close the Automation Provisioning CTask
          servicenow.itsm.change_request_task:
            state: closed
            close_code: "successful"
            close_notes: "Closed with AAP job # {{ tower_job_id }}"
            number: "{{ provision_ctask_number }}"
            other:
              work_notes: "Automated by AAP job ID: {{ tower_job_id }}"
          when: provision_ctask_number is defined

        - name: debug for Automation Provisioning ctask
          ansible.builtin.debug:
            var: ctask_provision
      rescue:
        - name: Log failure message
          ansible.builtin.debug:
            msg: "Provisioning failed — invoking error handling role."
        - name: Set Provisioning Success Flag to false
          ansible.builtin.set_fact:
            vm_provisioning_success: false
        - name: Call the error handling role
          ansible.builtin.include_role:
            name: error_handling
          vars:
            error_context: "Post-Provisioning Block failed."
            change_request_number: "{{ change_request_number }}"
            provision_ctask_number: "{{ provision_ctask_number }}"
            failed_stage: provisioning
      always:
        - name: Show final provisioning result
          ansible.builtin.debug:
            msg: "Provisioning success: {{ vm_provisioning_success | default(false) }}"
