---
- name: Deploy VM
  hosts: localhost
  vars_files:
     - vars/sizing.yml
     - vars/defaults.yml
  vars:
    aap_job_id: "{{ tower_job_id }}"
    aap_job_url: "https://{{ aap_controller_hostname }}/#/jobs/playbook/{{ tower_job_id }}/output"
  tasks:

  

    - name: Deploy {{ vm_provider }}
      ansible.builtin.debug:
         msg: 
            - "Calling {{ vm_provider }} VM Deploy with these parameters"
            - "Hostname --> {{ vm_hostname }}"
            - "Size --> {{ vm_size }}"
            - "Number of CPU --> {{ tshirt_sizes[vm_size].cpu}}"
            - "Memory --> {{ tshirt_sizes[vm_size].ram_gb}}"
            - "Storage --> {{ tshirt_sizes[vm_size].storage_gb}}"
            - "SNOW REQ ID --> {{ snow_request_item_number }}"
            - "SNOW CHANGE RQUEST NUMBER "
            

    
     # - name: Create VM on Nutanix
    #   nutanix.nutanix.nutanix_vm:
    #     prism_host: "{{ nutanix_host }}"
    #     prism_user: "{{ nutanix_username }}"
    #     prism_password: "{{ nutanix_password }}"
    #     validate_certs: false
    #     state: present
    #     name: "{{ vm_name }}"
    #     cluster: "{{ cluster_name }}"
    #     num_vcpus: "{{ tshirt_sizes[size].cpu }}"
    #     num_cores_per_vcpu: 1
    #     memory_gb: "{{ tshirt_sizes[size].ram_gb }}"
    #     nics:
    #       - network: "{{ network_name }}"
    #     disks:
    #       - size_gb: "{{ tshirt_sizes[size].storage_gb }}"
    #         type: "DISK"
    #         bus: "SCSI"
    #     power_state: "on"
    #   register: vm_result
    #   when: vm_provider is 'nutanix'


    - name: Post-Provisioning Block
      block:
        - name: Calling VM Provisioning Role
          ansible.builtin.debug:
            msg: "..... Provisioning Complete"

        - name: Set Provisioning Success Flag to true
          ansible.builtin.set_fact:
            vm_provisioning_success: true

        - name: Retrieve change requests by number
          servicenow.itsm.change_request_info:
             number: "{{ change_request_number }}"
          register: cr_info

        - name: debug result 
          ansible.builtin.debug: var=cr_info
        
        - name: Get tasks for that CR
          servicenow.itsm.change_request_task_info:
             sysparm_query: "change_request={{ cr_info.records[0].sys_id }}"
          register: cr_tasks

        # - name: get ctask 
        #   servicenow.itsm.change_request_task_info:
        #      number: CTASK0010340
        #   register: cr_tasks

        - name: debug ctasks 
          ansible.builtin.debug: var=cr_tasks

        

      rescue:
        - name: Log failure message
          ansible.builtin.debug:
            msg: "Provisioning failed — invoking error handling role."

        - name: Call the error handling role
          ansible.builtin.include_role:
            name: error_handling
          vars:
            error_context: "Post-Provisioning Block failed."
            
      always:
        - name: Show final provisioning result
          ansible.builtin.debug:
            msg: "Provisioning success: {{ vm_provisioning_success | default(false) }}"

