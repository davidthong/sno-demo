---
- name: Deploy VM
  hosts: localhost
  vars_files:
     - vars/sizing.yml
  tasks:

    - name: Pip install depedencies for servicenow.snow_record. TODO , create execution environment
      ansible.buitin.pip:
         name: 
            - pysnow
            - requests

    - name: Deploy {{ vm_provider }}
      ansible.builtin.debug:
         msg: 
            - "Calling {{ vm_provider }} VM Deploy with these parameters"
            - "Hostname --> {{ vm_hostname }}"
            - "Size --> {{ vm_size }}"
            - "Number of CPU --> {{ tshirt_sizes[vm_size].cpu}}"
            - "Memory --> {{ tshirt_sizes[vm_size].ram_gb}}"
            - "Storage --> {{ tshirt_sizes[vm_size].storage_gb}}"
            - "SNOW REQ ID --> {{ snow_request_item_number }}"

    
