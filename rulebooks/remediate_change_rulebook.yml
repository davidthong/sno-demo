---
- name: ServiceNow Scheduled Change Handler
  hosts: all

  sources:
    - name: Watch for updated change requests
      servicenow.itsm.records:
        instance:
          host: "{{ SN_HOST }}"
          username: "{{ SN_USERNAME }}"
          password: "{{ SN_PASSWORD }}"
          validate_certs: false
        table: change_request
        interval: 10
        sysparm_query: "state=Scheduled"
        updated_since: "2025-10-09 00:00:00"

  rules:
    - name: Launch AAP job when scheduled change detected
      condition: event.state == "Scheduled"
      action:
        run_job_template:
          name: "Remediate SNOW Demo"
          organization: "Default"
          job_args:
            extra_vars:
              cmdb_host: "{{ event.cmdb_ci.display_value | default('plexserver.lan') }}"
              change_number: "{{ event.number }}"
              description: "{{ event.short_description | default('No description') }}"
