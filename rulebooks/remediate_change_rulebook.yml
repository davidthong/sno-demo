---
- name: ServiceNow Scheduled Change Handler
  hosts: all

  sources:
    - name: Watch for scheduled change requests post approval
      servicenow.itsm.records:
        instance:
          host: https://ven05427.service-now.com
          username: "{{ SN_USERNAME }}"
          password: "{{ SN_PASSWORD }}"
          validate_certs: false
        table: change_request
        interval: 10
        sysparm_query: "state=-2"
        updated_since: "2025-10-08 00:00:00"
        custom_headers:
          sysparm_display_value: true

  rules:
    - name: Launch AAP job when scheduled change detected
      condition: event.state.display_value == "Scheduled"
      action:
        run_job_template:
          name: "Remediate SNOW Demo"
          organization: "Default"
          job_args:
            extra_vars:
              cmdb_host: "{{ event.cmdb_ci.display_value | default('plexserver.lan') }}"
              change_number: "{{ event.number }}"
              description: "{{ event.short_description | default('No description') }}"

    - name: Debug incoming change request event
      condition: event is defined
      action:
        debug:
          msg: >
            [DEBUG] SNOW event received:
            number={{ event.number }},
            state={{ event.state.display_value | default(event.state) }},
            cmdb_ci={{ event.cmdb_ci.display_value | default('N/A') }},
            updated_on={{ event.sys_updated_on | default('N/A') }},
            description={{ event.short_description | default('No description') }}
