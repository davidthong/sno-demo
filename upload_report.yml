---
- name: Generate HTML validation report and attach to RITM
  hosts: localhost
  gather_facts: false

  vars:
    ritm_number: "RITM0010186"
    report_file: "/tmp/ansible_report.html"
    report_name: "ansible_report.html"

  tasks:

    - name: Generate HTML validation report
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        mode: "0644"
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Automation Validation Report</title>

            <style>
              body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 40px;
                color: #222222;
                background-color: #ffffff;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
              }

              h1 {
                margin-bottom: 5px;
              }

              .subtitle {
                color: #666666;
                margin-bottom: 30px;
              }

              .status-box {
                padding: 16px 20px;
                background-color: #e8f5e9;
                border-left: 6px solid #2e7d32;
                margin-bottom: 30px;
              }

              .status-title {
                font-size: 20px;
                font-weight: bold;
                color: #2e7d32;
                margin-bottom: 5px;
              }

              .section-title {
                margin-top: 30px;
                margin-bottom: 10px;
                font-size: 20px;
              }

              table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
              }

              th,
              td {
                border: 1px solid #dddddd;
                padding: 12px;
                text-align: left;
              }

              th {
                background-color: #f5f5f5;
              }

              .passed {
                color: #2e7d32;
                font-weight: bold;
              }

              .footer {
                margin-top: 40px;
                padding-top: 15px;
                border-top: 1px solid #dddddd;
                color: #777777;
                font-size: 12px;
              }
            </style>
          </head>

          <body>

            <div class="container">

              <h1>Automation Validation Report</h1>

              <div class="subtitle">
                Generated by Ansible Automation Platform
              </div>

              <div class="status-box">
                <div class="status-title">
                  Validation Passed
                </div>

                <div>
                  All automated validation checks completed successfully.
                </div>
              </div>

              <div class="section-title">
                Request Details
              </div>

              <table>
                <tr>
                  <th>RITM</th>
                  <td>{{ ritm_number }}</td>
                </tr>

                <tr>
                  <th>Validation Status</th>
                  <td class="passed">Passed</td>
                </tr>

                <tr>
                  <th>Execution Platform</th>
                  <td>Ansible Automation Platform</td>
                </tr>

                <tr>
                  <th>Report Name</th>
                  <td>{{ report_name }}</td>
                </tr>
              </table>

              <div class="section-title">
                Validation Results
              </div>

              <table>
                <tr>
                  <th>Validation Check</th>
                  <th>Result</th>
                </tr>

                <tr>
                  <td>System Connectivity</td>
                  <td class="passed">Passed</td>
                </tr>

                <tr>
                  <td>Configuration Validation</td>
                  <td class="passed">Passed</td>
                </tr>

                <tr>
                  <td>Application Validation</td>
                  <td class="passed">Passed</td>
                </tr>

                <tr>
                  <td>Post-Deployment Validation</td>
                  <td class="passed">Passed</td>
                </tr>
              </table>

              <div class="section-title">
                Summary
              </div>

              <p>
                Automation completed successfully and all validation checks passed.
                No manual remediation is required.
              </p>

              <div class="footer">
                This report was generated automatically by Ansible Automation Platform.
              </div>

            </div>

          </body>
          </html>

    - name: Look up RITM
      servicenow.itsm.api_info:
        resource: sc_req_item
        sysparm_query: "number={{ ritm_number }}"
        columns:
          - sys_id
          - number
      register: ritm_lookup

    - name: Verify RITM was found
      ansible.builtin.assert:
        that:
          - ritm_lookup.record | length > 0
        fail_msg: "RITM {{ ritm_number }} was not found"

    - name: Set RITM sys_id
      ansible.builtin.set_fact:
        ritm_sys_id: "{{ ritm_lookup.record[0].sys_id }}"

    - name: Upload HTML report to RITM
      servicenow.itsm.attachment_upload:
        table_name: sc_req_item
        table_sys_id: "{{ ritm_sys_id }}"
        attachments:
          - path: "{{ report_file }}"
            name: "{{ report_name }}"
            type: "text/html"
      register: attachment_result

    - name: Add validation comment to RITM
      servicenow.itsm.api:
        resource: sc_req_item
        action: patch
        sys_id: "{{ ritm_sys_id }}"
        data:
          comments: |
            Validation passed successfully.

            See attached report for full validation details:
            {{ report_name }}

    - name: Show attachment result
      ansible.builtin.debug:
        var: attachment_result
