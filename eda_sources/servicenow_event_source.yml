---
sources:
  - name: servicenow_change_source
    ansible.eda.servicenow:
      instance: https://ven05427.service-now.com
      username: "{{ SN_USERNAME }}"
      password: "{{ SN_PASSWORD }}"
      table: change_request
      interval: 60
      query: "state=3^cmdb_ciISNOTEMPTY"
      fields:
        - number
        - state
        - short_description
        - cmdb_ci
        - sys_id
        - start_date
        - end_date

