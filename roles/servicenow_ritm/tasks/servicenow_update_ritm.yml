---
- name: Get RITM By Number
  ansible.builtin.include_tasks: servicenow_ritm_by_number.yml

- name: Post a worknote and a comment on ticket# {{ snow_request_item_number }} when success
  servicenow.itsm.api:
    resource: sc_req_item
    action: patch
    sys_id: "{{ ritm_info.sys_id }}"
    data:
      work_notes: "{{ ritm_work_notes }}"
      comments: "{{ ritm_comments }}"
#      work_notes: "Provisioning complete. View job: [AAP Job #{{ aap_job_id }}]({{ aap_job_url }})"
#      comments: "This has been provisioned using Ansible Automation"
  delegate_to: localhost
