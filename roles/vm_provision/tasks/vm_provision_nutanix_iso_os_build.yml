- name: Set ISO variables
  ansible.builtin.set_fact:
    iso_name: "{{ vm_name }}.iso"

- name: Set Host ID Fact
  ansible.builtin.set_fact:
    host_id: "{{ new_host_check.entity.hosts[0].id }}"

- name: Common ISO setup variables
  ansible.builtin.set_fact:
    iso_source_uri: "{{ satellite_server_url }}/api/bootdisk/hosts/{{ host_id }}?full=true"

