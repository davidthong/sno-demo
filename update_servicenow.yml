- name: Update ServiceNow
  hosts: localhost
  gather_facts: false

  vars:
    aap_url: "https://aap24.dthong.com"
    job_id: 138

  tasks:

    - name: Get job stdout in JSON format
      ansible.builtin.uri:
        url: "{{ aap_url }}/api/v2/jobs/{{ job_id }}/stdout/?format=json"
        method: GET
        user: "{{ lookup('env', 'AAP_API_USER') }}"
        password: "{{ lookup('env', 'AAP_API_PASS') }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: job_json

    - name: Set raw log from API result
      ansible.builtin.set_fact:
        raw_log: "{{ job_json.json.content }}"

    - name: Remove ANSI color codes
      set_fact:
        clean_log: "{{ raw_log | regex_replace('\\x1b\\[[0-9;]*m', '') }}"

    - debug: var=clean_log

    - name: Extract structured task lines
      set_fact:
        task_lines: >-
          {{
            clean_log.split('\n')
            | select('match', '^\\s*(TASK \\[|ok:|failed:|changed:)')
            | list
          }}

    - debug: var=task_lines

    - name: Build SNOW work notes
      set_fact:
        work_notes: |
          Ansible Job {{ job_id }} Summary
          --------------------------------

          {% for line in task_lines %}
          {{ line }}
          {% endfor %}

          (Generated automatically by AAP)

    - name: Display formatted work notes
      debug:
        msg: "{{ work_notes }}"
